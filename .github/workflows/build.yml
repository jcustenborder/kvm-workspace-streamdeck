name: Verify and release Stream Deck plugin

on:
  pull_request:
  push:
    branches: [initial, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: streamdeck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub requires push access to include reserved draft releases in the list.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select next main release, including reserved drafts
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          node scripts/release-version.cjs "$RUNNER_TEMP/releases.json"

  verify:
    needs: prepare
    if: always() && !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build plugin
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then unset RELEASE_VERSION; fi
          npm run build
      - run: npm run validate
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-${{ github.sha }}
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: streamdeck-${{ github.sha }}
          path: dist
      - name: Publish verified installer
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Release tag points to a different commit: $RELEASE_TAG" >&2
              exit 1
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          STATE="$(node <<'NODE'
            const { readFileSync } = require('node:fs');
            const { planRelease } = require('./scripts/release-version.cjs');
            const releases = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/releases.json', 'utf8')).flat();
            const plan = planRelease(process.env.RELEASE_VERSION, releases, process.env.GITHUB_SHA);
            if (plan.tag !== process.env.RELEASE_TAG) throw new Error('Release version changed during the build');
            console.log(plan.published ? 'published' : plan.exists ? 'draft' : 'new');
          NODE
          )"
          if [[ "$STATE" = published ]]; then
            echo "Release already published: $RELEASE_TAG"
            exit 0
          fi
          if [[ "$STATE" = draft ]]; then
            gh release upload "$RELEASE_TAG" dist/*.streamDeckPlugin --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.streamDeckPlugin \
              --target "$GITHUB_SHA" --draft \
              --title "KVM Workspace Stream Deck $RELEASE_TAG" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
